name: security

on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make vulncheck