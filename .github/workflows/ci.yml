name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.golangci.yml'
      - 'config.yaml'
      - 'internal/database/migrations/**'
      - 'demo/**'
      - 'scripts/demo.sh'
      - 'web/**'
      - 'docs/architecture/openapi.yaml'
      - '.github/workflows/ci.yml'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags, for the version built into the binary
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go' ':!:vendor/**'))"
      - name: build with version
        run: make build && ./household-app -version
      - run: go vet ./...
      - name: error message style
        # A negated command does not stop a bash script, so each check
        # fails the job explicitly.
        run: |
          if git grep -nE 'Errorf\("(failed|error|unable)' -- '*.go'; then
            echo "::error::error messages must not start with failed, error or unable"
            exit 1
          fi
      - run: go test -shuffle=on ./...
      - name: lint
        run: make lint-code

  e2e:
    # The built server on the demo household, once for each set of modules (web/playwright.config.ts).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build the web app and the server
        run: |
          npm ci --prefix web
          make web-build build
      - name: install the browser
        run: npx --prefix web playwright install --with-deps chromium
      - name: end-to-end tests
        run: npm run e2e --prefix web
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 1
